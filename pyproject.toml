[project]
name = "kickcoach"
version = "0.2.0.dev0"
description = "Measure a football kick from ordinary video, validated against human-labelled ground truth."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime deps are added by the phase that first needs them (see docs/PLAN.md).
dependencies = [
    "ai-edge-litert>=2.3",
    "av>=14",
    "google-genai>=1",
    "mediapipe>=1.1",
    "numpy>=2.0",
    "onnxruntime>=1.31",
    "pillow>=11",
    "python-dotenv>=1",
    "rtmlib>=0.0.16",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
tools = [
    "yt-dlp[default]>=2026.10.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kickcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# eval/ scripts are imported by their tests (python -m eval.<name> from the repo root).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
