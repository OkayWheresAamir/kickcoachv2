# The coaching corpus for retrieval (Phase 8, E6; handoff D14). Each chunk is a verbatim
# excerpt from a source Aamir approved (DEC-037). tests/test_corpus.py checks every chunk
# against the downloaded source text when it is present (tools/coaching_sources.py).
#
# Licences: the open-access and CC sources are quoted freely, with attribution. Excerpts
# from the copyrighted free-to-read sources (Special Olympics, The FA) are at most 60 words
# each and carry their URL; the full text is never committed (handoff risk table).
#
# Tags (D14), written by Claude from what each passage is about, not from any query:
#   faults:    fault rules (knowledge/faults.yaml) whose aspect of technique the passage
#              addresses: trunk position at contact (F-LEAN-BACK), knee bend in the backswing
#              (F-SHALLOW-BACKSWING), standing-foot placement (F-PLANT-FAR-BEHIND), the
#              order of thigh and shank speed (F-REVERSED-SEQUENCE). Empty = none of them.
#   kick_type: instep (driven/laces kick), general (any kick), other (a different kick).
#   level:     any, or the population the passage is about.
# The kind of help a passage gives (why / cue / drill) is deliberately not a tag: E6 asks
# whether embeddings can find it inside a fault's chunks.

