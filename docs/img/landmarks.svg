<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Where each landmark goes, side view at ball contact (schematic)</title>
  <rect width="680" height="450" fill="#ffffff"/>
  <!-- ground -->
  <line x1="20" y1="407" x2="330" y2="407" stroke="#9aa3ad" stroke-width="2"/>
  <!-- body outline (schematic) -->
  <circle cx="150" cy="62" r="22" fill="#e9edf1" stroke="#5c6670" stroke-width="2"/>
  <line x1="148" y1="84" x2="148" y2="100" stroke="#5c6670" stroke-width="10" stroke-linecap="round"/>
  <path d="M128 100 L168 102 L160 222 L120 220 Z" fill="#e9edf1" stroke="#5c6670" stroke-width="2"/>
  <!-- far (left) plant leg: blue -->
  <polyline points="134,211 148,300 146,385" fill="none" stroke="#1f7ab8" stroke-width="3"/>
  <polyline points="146,385 134,398 172,400 146,385" fill="none" stroke="#1f7ab8" stroke-width="2"/>
  <!-- near (right) kicking leg: orange, knee slightly bent, foot pointed -->
  <line x1="152" y1="112" x2="140" y2="215" stroke="#d9541e" stroke-width="3"/>
  <polyline points="140,215 205,282 236,352" fill="none" stroke="#d9541e" stroke-width="3"/>
  <polyline points="236,352 222,345 262,388 236,352" fill="none" stroke="#d9541e" stroke-width="2"/>
  <!-- ball -->
  <circle cx="284" cy="385" r="22" fill="#fff6b0" stroke="#8a7a00" stroke-width="2"/>
  <!-- points: filled = visible (v=2), hollow = occluded estimate (v=1) -->
  <circle cx="146" cy="108" r="5" fill="#ffffff" stroke="#1f7ab8" stroke-width="2.5"/>
  <circle cx="134" cy="211" r="5" fill="#ffffff" stroke="#1f7ab8" stroke-width="2.5"/>
  <circle cx="148" cy="300" r="5" fill="#1f7ab8"/>
  <circle cx="146" cy="385" r="5" fill="#1f7ab8"/>
  <circle cx="134" cy="398" r="5" fill="#1f7ab8"/>
  <circle cx="172" cy="400" r="5" fill="#1f7ab8"/>
  <circle cx="152" cy="112" r="5" fill="#d9541e"/>
  <circle cx="140" cy="215" r="5" fill="#d9541e"/>
  <circle cx="205" cy="282" r="5" fill="#d9541e"/>
  <circle cx="236" cy="352" r="5" fill="#d9541e"/>
  <circle cx="222" cy="345" r="5" fill="#d9541e"/>
  <circle cx="262" cy="388" r="5" fill="#d9541e"/>
  <circle cx="284" cy="385" r="3.5" fill="#8a7a00"/>
  <!-- leader lines, ordered top to bottom so they don't cross -->
  <g stroke="#9aa3ad" stroke-width="1" fill="none">
    <line x1="157" y1="112" x2="330" y2="40"/>
    <line x1="145" y1="215" x2="330" y2="100"/>
    <line x1="210" y1="282" x2="330" y2="160"/>
    <line x1="222" y1="340" x2="330" y2="220"/>
    <line x1="241" y1="352" x2="330" y2="272"/>
    <line x1="267" y1="388" x2="330" y2="330"/>
    <line x1="288" y1="385" x2="330" y2="388"/>
  </g>
  <g fill="#1d2329">
    <text x="336" y="36"><tspan font-weight="bold">Shoulder</tspan>: centre of the shoulder joint (the ball</text>
    <text x="336" y="52">of the upper-arm bone), below the top of the shoulder.</text>
    <text x="336" y="96"><tspan font-weight="bold">Hip</tspan>: centre of the hip joint. From the side, use the</text>
    <text x="336" y="112">bony point on the side of the hip (greater trochanter).</text>
    <text x="336" y="156"><tspan font-weight="bold">Knee</tspan>: middle of the knee seen from the side</text>
    <text x="336" y="172">(between the femoral epicondyles), not the kneecap.</text>
    <text x="336" y="216"><tspan font-weight="bold">Heel</tspan>: centre of the heel bone, inside the shoe;</text>
    <text x="336" y="232">not the back edge of the shoe.</text>
    <text x="336" y="268"><tspan font-weight="bold">Ankle</tspan>: middle of the ankle bones (the malleoli,</text>
    <text x="336" y="284">the bumps either side of the ankle).</text>
    <text x="336" y="326"><tspan font-weight="bold">Big toe</tspan>: centre of the big toe near its nail;</text>
    <text x="336" y="342">inside the shoe, a little short of the shoe's tip.</text>
    <text x="336" y="392"><tspan font-weight="bold">Ball</tspan>: centre of the ball's outline.</text>
  </g>
  <g font-size="12" fill="#5c6670">
    <circle cx="30" cy="430" r="5" fill="#d9541e"/><text x="40" y="434">visible (v=2)</text>
    <circle cx="140" cy="430" r="5" fill="#ffffff" stroke="#1f7ab8" stroke-width="2.5"/><text x="150" y="434">occluded, your estimate (v=1)</text>
    <text x="336" y="434">blue = left, orange = right (as in the tool). Schematic.</text>
  </g>
</svg>
